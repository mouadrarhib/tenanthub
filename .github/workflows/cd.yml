name: CD (Continuous Delivery)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      tenant-service: ${{ steps.filter.outputs.tenant-service }}
      project-service: ${{ steps.filter.outputs.project-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      billing-service: ${{ steps.filter.outputs.billing-service }}
      gateway-service: ${{ steps.filter.outputs.gateway-service }}
      discovery-service: ${{ steps.filter.outputs.discovery-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'pom.xml'
              - 'shared-events/**'
            auth-service:
              - 'auth-service/**'
            tenant-service:
              - 'tenant-service/**'
            project-service:
              - 'project-service/**'
            notification-service:
              - 'notification-service/**'
            billing-service:
              - 'billing-service/**'
            gateway-service:
              - 'gateway-service/**'
            discovery-service:
              - 'discovery-service/**'

  docker-build-push:
    name: Build & Push ${{ matrix.service }}
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - tenant-service
          - project-service
          - notification-service
          - billing-service
          - gateway-service
          - discovery-service
    steps:
      - name: Check if image should be built
        id: check
        run: |
          if [ "${{ needs.detect-changes.outputs.shared }}" = "true" ] || [ "${{ needs.detect-changes.outputs[matrix.service] }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_image=true" >> $GITHUB_OUTPUT
          else
            echo "build_image=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.build_image == 'true'

      - name: Set up Docker Buildx
        if: steps.check.outputs.build_image == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.check.outputs.build_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        if: steps.check.outputs.build_image == 'true'
        id: repo_name
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check.outputs.build_image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
