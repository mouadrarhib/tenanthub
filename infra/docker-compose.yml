# Runs the entire TenantHub stack locally: 4 Postgres instances (one per
# stateful service - matches the "database-per-service" principle from
# tenanthub-architecture.html), Kafka, Redis, and all 7 Spring Boot services.
#
# Usage (from the tenanthub/ repo root):
#   cp infra/.env.example infra/.env   # fill in real values, once
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
#
# Every `build.context: ..` below resolves relative to this file's
# directory, i.e. the repo root - required because each service's Dockerfile
# needs the sibling shared-events module and the root pom.xml's reactor.

services:

  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------

  # Host ports below start at 5433, not 5432 - a local Postgres install
  # already owns 5432 on this machine. Published purely so a DB client
  # (DBeaver etc.) on the host can connect directly; app services still
  # talk to these over the compose network on the standard 5432.
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tenant-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tenant_db
    ports:
      - "5434:5432"
    volumes:
      - tenant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  project-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tenanthub_project
    ports:
      - "5435:5432"
    volumes:
      - project-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tenanthub_billing
    ports:
      - "5436:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (combined broker+controller) - no
  # Zookeeper needed. Internal-only for the Kafka protocol port (9092) -
  # nothing outside the compose network talks to that. The JMX-to-Prometheus
  # exporter port (7071) below *is* published, same as the other scrape
  # targets, so the host-side Prometheus UI/debugging can hit it directly.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # kafka-run-class.sh passes KAFKA_OPTS straight through to the JVM
      # command line, so this is enough to attach the jmx_exporter javaagent
      # without a custom image - it starts its own HTTP server on 7071
      # (config below), separate from Kafka's own JMX port.
      KAFKA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.20.0.jar=7071:/opt/jmx-exporter/kafka-jmx-exporter-config.yml"
    ports:
      - "7071:7071"
    volumes:
      - ./kafka-jmx-exporter/jmx_prometheus_javaagent-0.20.0.jar:/opt/jmx-exporter/jmx_prometheus_javaagent-0.20.0.jar:ro
      - ./kafka-jmx-exporter/kafka-jmx-exporter-config.yml:/opt/jmx-exporter/kafka-jmx-exporter-config.yml:ro

  # Real per-consumer-group lag, unlike the JMX exporter above - it talks the
  # Kafka protocol directly (Admin API) to compute lag per group/topic/
  # partition, which isn't something the broker exposes over JMX at all.
  # group-whitelist = [".*"] in application.conf watches every group, so both
  # billing-service and notification-service show up without hardcoding either.
  kafka-lag-exporter:
    image: seglo/kafka-lag-exporter:0.8.2
    restart: unless-stopped
    command: ["/opt/docker/bin/kafka-lag-exporter", "-Dconfig.file=/opt/docker/conf/application.conf"]
    environment:
      # Works around a JDK 17 bug (cgroup v2 detection NPEs under Docker
      # Desktop's VM) that otherwise crashes the app before its Prometheus
      # endpoint ever binds - disables JVM container-resource auto-detection,
      # which this exporter doesn't need anyway.
      JAVA_OPTS: "-XX:-UseContainerSupport"
    ports:
      - "8000:8000"
    volumes:
      - ./kafka-lag-exporter/application.conf:/opt/docker/conf/application.conf:ro
    depends_on:
      kafka:
        condition: service_started

  # Dev-only browser UI for inspecting Kafka topics/messages. Not part of
  # the application - safe to remove, exists purely for local debugging.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tenanthub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  # Dev-only fake SMTP server + web UI - catches every email notification-service
  # sends instead of delivering it anywhere. No auth needed on the SMTP side, so
  # notification-service's mail username/password are simply left unset locally.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Scrapes every app service's /actuator/prometheus by static Compose
  # hostname:port - see infra/prometheus.yml. Same purpose as
  # infra/k8s/31-prometheus.yaml, just without the Kubernetes pod discovery
  # (not needed here - one instance per service, no replicas locally).
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Same provisioning (datasource + dashboard) as infra/k8s/32-grafana.yaml,
  # mounted from local files instead of ConfigMaps.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Same reasoning as 32-grafana.yaml: no route out to the internet from
      # this stack is assumed, and the plugin preinstaller otherwise hangs.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------

  discovery-service:
    build:
      context: ..
      dockerfile: discovery-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      auth-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tenant-service:
    build:
      context: ..
      dockerfile: tenant-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tenant-db:5432/tenant_db
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      tenant-db:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  project-service:
    build:
      context: ..
      dockerfile: project-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://project-db:5432/tenanthub_project
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      project-db:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
      auth-service:
        condition: service_started
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  billing-service:
    build:
      context: ..
      dockerfile: billing-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/tenanthub_billing
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      billing-db:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
      auth-service:
        condition: service_started
      tenant-service:
        condition: service_started
      project-service:
        condition: service_started
      billing-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  auth-db-data:
  tenant-db-data:
  project-db-data:
  billing-db-data:
