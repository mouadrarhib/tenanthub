# Points kafka-lag-exporter at the same broker every app service already
# talks to (kafka:9092, internal-only PLAINTEXT listener - see
# infra/docker-compose.yml). group-whitelist = [".*"] watches every consumer
# group rather than hardcoding billing-service, so notification-service (and
# anything added later) shows up automatically.
kafka-lag-exporter {
  clusters = [
    {
      name = "tenanthub"
      bootstrap-brokers = "kafka:9092"
      group-whitelist = [".*"]
      topic-whitelist = [".*"]
    }
  ]
}
