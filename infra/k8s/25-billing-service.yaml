apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tenanthub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: tenanthub/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef: { name: tenanthub-config }
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://billing-db:5432/tenanthub_billing"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: tenanthub-secrets, key: POSTGRES_PASSWORD }
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Gates readiness/liveness until the app has started once - see
          # 20-discovery-service.yaml for why this is needed (CPU-limited JVM
          # startup is much slower than a plain initialDelaySeconds expects).
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: tenanthub
spec:
  selector:
    app: billing-service
  ports:
    - port: 8085
      targetPort: 8085
