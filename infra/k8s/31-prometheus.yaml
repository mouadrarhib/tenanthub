# Scrapes every app service's /actuator/prometheus by discovering individual
# Pods through the Kubernetes API (role: pod), not by hitting each service's
# ClusterIP. Services like auth-service/gateway-service run 2 replicas behind
# one load-balanced VIP - scraping the VIP makes kube-proxy hand each 15s
# scrape to a different, independent replica, so the "same" counter jumps
# between two unrelated cumulative totals and rate() reads as noise/resets.
# Discovering Pods directly gives Prometheus one stable target per replica.
# No PVC - metrics history resets on Pod restart, fine for a demo cluster; a
# real deployment would use a PVC or a managed Prometheus (Grafana Cloud, AMP).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: tenanthub
---
# Cluster-scoped because pod discovery watches the API server, not just this
# namespace's objects - kept read-only (get/list/watch), no write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: tenanthub
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tenanthub
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'tenanthub-services'
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['tenanthub']
        relabel_configs:
          # only our 7 app services carry this label with one of these
          # values (Postgres/Redis/Kafka/Prometheus/Grafana pods don't match,
          # so they're never scraped for Spring's /actuator/prometheus)
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: 'discovery-service|auth-service|tenant-service|project-service|notification-service|billing-service|gateway-service'
            action: keep
          # only scrape once the Pod is actually ready, not while it's still
          # inside its startupProbe window
          - source_labels: [__meta_kubernetes_pod_ready]
            regex: 'true'
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ':'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # jmx_prometheus_javaagent attached to the kafka Deployment via
      # KAFKA_OPTS (see infra/k8s/15-kafka.yaml) - kafka isn't one of the 7
      # app-service pods above, so it needs its own static target rather than
      # the label-based pod discovery. The kafka Service resolves within the
      # namespace by its short name, same as any other in-cluster DNS lookup.
      - job_name: 'kafka-broker'
        static_configs:
          - targets:
              - 'kafka:7071'
            labels:
              job: 'kafka-broker'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tenanthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "400m" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tenanthub
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
