apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tenanthub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tenanthub/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: { name: tenanthub-config }
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Gates readiness/liveness until the app has started once - see
          # 20-discovery-service.yaml for why this is needed (CPU-limited JVM
          # startup is much slower than a plain initialDelaySeconds expects).
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: tenanthub
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
