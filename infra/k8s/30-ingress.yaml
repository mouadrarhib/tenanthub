# Requires an Ingress controller in the cluster (e.g. ingress-nginx -
# `minikube addons enable ingress` or `kind` + the ingress-nginx manifest).
# Change the host below to whatever you've mapped locally (e.g. in
# /etc/hosts) or to a real domain in production.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenanthub-ingress
  namespace: tenanthub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: tenanthub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
