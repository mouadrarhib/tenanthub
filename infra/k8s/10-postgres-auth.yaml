# Single-replica Postgres for auth-service, self-hosted in-cluster. Real
# production would swap this for a managed database (RDS, Cloud SQL, etc.)
# and skip the Deployment+PVC entirely - k8s-complete-guide.html (#11) calls
# this out explicitly. Kept here so the whole stack is deployable as-is on a
# local cluster (kind/minikube) for a full end-to-end demo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-pvc
  namespace: tenanthub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: tenanthub
spec:
  replicas: 1
  strategy:
    type: Recreate # a second Postgres Pod can't share the same PVC
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "auth_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenanthub-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: tenanthub
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
