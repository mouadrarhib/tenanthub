# ClusterIP (the default - no `type:` needed): the Ingress in
# 30-ingress.yaml is the actual external entry point, matching the pattern
# in k8s-complete-guide.html #20 (Ingress -> Service: gateway-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: tenanthub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: tenanthub/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: tenanthub-config }
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: tenanthub
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
