# ClusterIP (the default - no `type:` needed): the Ingress in
# 30-ingress.yaml is the actual external entry point, matching the pattern
# in k8s-complete-guide.html #20 (Ingress -> Service: gateway-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: tenanthub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: infra-gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: tenanthub-config }
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Gates readiness/liveness until the app has started once - see
          # 20-discovery-service.yaml for why this is needed (CPU-limited JVM
          # startup is much slower than a plain initialDelaySeconds expects).
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: tenanthub
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
