# Images referenced below (infra-<service>:latest) are built locally by
# `docker compose build` in infra/ (compose names images
# <project-dir>-<service>, hence the infra- prefix) and are not pushed to a
# registry. Docker Desktop's Kubernetes node picks them up automatically via
# its containerd registry mirror - no `kind load` needed.
#
# Single replica - Eureka here is a demo-scale service registry, not a
# highly-available cluster (application.yml already sets
# register-with-eureka/fetch-registry: false, i.e. it doesn't peer with
# other Eureka instances, so running >1 replica wouldn't share state anyway).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: tenanthub
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: infra-discovery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Gates readiness/liveness until the app has started once - a JVM's
          # startup is far more CPU-hungry than steady-state, and under the
          # cpu limit below it can take well over a minute, way past what a
          # normal liveness initialDelaySeconds would tolerate. Without this,
          # the kubelet kills the Pod mid-boot, forever.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: tenanthub
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
