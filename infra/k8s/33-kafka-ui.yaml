# Dev-only browser UI for inspecting Kafka topics/messages, same image and
# purpose as infra/docker-compose.yml's kafka-ui service. Not part of the
# application - no Ingress route, reach it with:
#   kubectl -n tenanthub port-forward svc/kafka-ui 8090:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: tenanthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "tenanthub"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits: { memory: "512Mi", cpu: "500m" }
          # Gates readiness/liveness until the app has started once - see
          # 20-discovery-service.yaml for why this is needed (CPU-limited JVM
          # startup is much slower than a plain initialDelaySeconds expects).
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: tenanthub
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
