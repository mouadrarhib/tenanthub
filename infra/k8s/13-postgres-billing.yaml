apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: billing-db-pvc
  namespace: tenanthub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-db
  namespace: tenanthub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: billing-db
  template:
    metadata:
      labels:
        app: billing-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "tenanthub_billing"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenanthub-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: billing-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: billing-db
  namespace: tenanthub
spec:
  selector:
    app: billing-db
  ports:
    - port: 5432
      targetPort: 5432
